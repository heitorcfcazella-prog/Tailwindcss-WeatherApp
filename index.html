<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/src/output.css">
  <title>Weather App - Tailwind CSS</title>
</head>

<body class="bg-ensolarado-erro">
  <div>
    <img src="./assets/search.svg" alt="Pesquisa">
    <p>Pesquisar cidade...</p>
  </div>
  <div>
    <img src="./assets/sun.svg" alt="Icone clima">
  </div>
  <div class="card">
    <div class="clima-atual">
      <p>São Paulo</p>
      <h2>26°C</h2>
      <p>Ensolarado</p>
    </div>
    <div class="mini-cards-container">
      <div class="mini-cards">
        <img src="./assets/wind.svg" alt="Vento">
        <p>12 km/h</p>
        <p>Vento</p>
      </div>
      <div class="mini-cards">
        <img src="./assets/gota.svg" alt="Umidade">
        <p>65%</p>
        <p>Umidade</p>
      </div>
      <div class="mini-cards">
        <img src="./assets/barometer.svg" alt="Pressão">
        <p>1015 hPa</p>
        <p>Pressão</p>
      </div>
    </div>
    <div class="mini-cards-container">
      <div class="mini-cards">
        <p>9:00</p>
        <img src="./assets/sun.svg" alt="Ensolarado">
        <p>25°C</p>
      </div>
      <div class="mini-cards">
        <p>11:00</p>
        <img src="./assets/sun.svg" alt="Ensolarado">
        <p>26°C</p>
      </div>
      <div class="mini-cards">
        <p>13:00</p>
        <img src="./assets/sun.svg" alt="Ensolarado">
        <p>28°C</p>
      </div>
    </div>
  </div>
</body>

</html>
