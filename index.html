<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/src/output.css">
  <title>Weather App - Tailwind CSS</title>
</head>

<body class="bg-ensolarado-erro">
  <div class="fundo-animado">
    <img src="./assets/cloud.svg" alt="" class="nuvem">
    <img src="./assets/cloud.svg" alt="" class="nuvem">
    <img src="./assets/cloud.svg" alt="" class="nuvem">
    <img src="./assets/cloud.svg" alt="" class="nuvem">
    <img src="./assets/cloud.svg" alt="" class="nuvem">
  </div>
  <div class="conteudo">
    <div class="justify-center card-pesquisa">
      <img src="./assets/search.svg" alt="Pesquisa">
      <input type="text" name="cidade" id="nomeCidade" class="texto-medio" placeholder="Pesquisar cidade...">
    </div>
    <div class="justify-center">
      <img src="./assets/sun.svg" alt="Icone clima" id="iconeClima" class="img-grande">
    </div>
    <div class="card">
      <div class="clima-atual">
        <p class="texto-medio">São Paulo</p>
        <h2 class="texto-grande">26°C</h2>
        <p class="texto-medio">Ensolarado</p>
      </div>
      <div class="mini-cards-container">
        <div class="mini-cards">
          <img src="./assets/wind.svg" alt="Vento" class="img-pequena">
          <p class="texto-pequeno">12 km/h</p>
          <p class="texto-pequeno">Vento</p>
        </div>
        <div class="mini-cards">
          <img src="./assets/gota.svg" alt="Umidade" class="img-pequena">
          <p class="texto-pequeno">65%</p>
          <p class="texto-pequeno">Umidade</p>
        </div>
        <div class="mini-cards">
          <img src="./assets/barometer.svg" alt="Pressão" class="img-pequena">
          <p class="texto-pequeno">1015 hPa</p>
          <p class="texto-pequeno">Pressão</p>
        </div>
      </div>
      <div class="mini-cards-container">
        <div class="mini-cards">
          <p>9:00</p>
          <img src="./assets/sun.svg" alt="Ensolarado" class="img-pequena">
          <p>25°C</p>
        </div>
        <div class="mini-cards">
          <p>11:00</p>
          <img src="./assets/sun.svg" alt="Ensolarado" class="img-pequena">
          <p>26°C</p>
        </div>
        <div class="mini-cards">
          <p>13:00</p>
          <img src="./assets/sun.svg" alt="Ensolarado" class="img-pequena">
          <p>28°C</p>
        </div>
      </div>
    </div>
  </div>
  <script src="./app/src/script.js"></script>
</body>

</html>
