<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./app/src/output.css">
  <title>Weather App - Tailwind CSS</title>
</head>

<body class="bg-ensolarado-erro">
  <div class="fundo-animado" id="fundo-nuvens">
    
  </div>
  <div class="conteudo">
    <div class="justify-center card-pesquisa">
      <img src="./assets/search.svg" alt="Pesquisa" class="icone-pesquisa">
      <input type="text" name="cidade" id="nomeCidade" class="texto-medio input-cidade" placeholder="Pesquisar cidade...">
      <button type="submit" id="buscarCidade" class="texto-medio botao-buscar">Buscar</button>
    </div>
    <div class="justify-center">
      <img src="./assets/sun.svg" alt="Icone clima" id="iconeClima" class="img-grande">
    </div>
    <div class="card" id="conteudo">
      
    </div>
  </div>
  <script src="./app/src/script.js"></script>
</body>

</html>
